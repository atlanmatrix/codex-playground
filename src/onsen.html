<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<meta name="theme-color" content="#d8e5d5">
<meta name="description" content="山中的温泉旅馆。层叠山腰台地上的木造旅馆、客舍与更开阔的露天岩汤，松林和山溪沿坡生长。点击太阳或月亮，在暖阳庭院与灯火温泉之间切换。">
<title>山中温泉旅馆 — A quiet mountain retreat</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:radial-gradient(ellipse at 30% 20%,#fbf3dc,#d9e8d9 57%,#bad6cf)}body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 40% 15%,#273c5b,#17263e 58%,#0e1a30);opacity:0;transition:opacity .8s ease;pointer-events:none}body[data-period="night"]::before{opacity:1}canvas{position:relative;display:block;width:100%;height:100%;touch-action:none;outline:none;cursor:grab}canvas:active{cursor:grabbing}.time-switch{position:fixed;z-index:2;top:max(20px,env(safe-area-inset-top));right:max(20px,env(safe-area-inset-right));display:flex;gap:4px;padding:5px;border:1px solid #fff9;border-radius:30px;background:#faf8ebc9;box-shadow:0 3px 16px #294b3c12;backdrop-filter:blur(12px)}.time-switch[hidden]{display:none}.time-switch button{display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;border-radius:50%;background:transparent;color:#6a8072;cursor:pointer;touch-action:manipulation;transition:background .2s,color .2s}.time-switch button:hover{background:#e2e9dc}.time-switch button[aria-pressed="true"]{background:#fff9e5;color:#9b7942;box-shadow:0 1px 6px #56735a17}.time-switch button:focus-visible{outline:2px solid #779f87;outline-offset:2px}.time-switch svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}body[data-period="night"] .time-switch{background:#1b2c45cc;border-color:#a8bbd02b}body[data-period="night"] .time-switch button{color:#a8bad2}body[data-period="night"] .time-switch button:hover{background:#33465f}body[data-period="night"] .time-switch button[aria-pressed="true"]{background:#3d4d67;color:#ffe0a7}@media(prefers-reduced-motion:reduce){body::before,.time-switch button{transition:none}}
</style>
</head>
<body>
<div class="time-switch" role="group" aria-label="日夜切换">
<button type="button" data-time="day" aria-label="切换到白天" title="白天" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
<button type="button" data-time="night" aria-label="切换到夜晚" title="夜晚" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 14.2A8.4 8.4 0 0 1 9.8 3.8 8.5 8.5 0 1 0 20.2 14.2Z"/><path d="M17 3v4m-2-2h4"/></svg></button>
</div>
<script>/* SCENE */</script></body>
</html>
