<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<meta name="theme-color" content="#e7eadf">
<meta name="description" content="剪辑师的午后书房。阳光穿过半开的窗户，轻风拂动窗帘；夜晚关窗合帘、点亮暖灯，白天恢复日光；支持自动与手动昼夜切换。">
<title>剪辑师的午后书房 — The afternoon edit</title>
<style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:radial-gradient(ellipse at 32% 15%,#fff9ea,#e6eadf 58%,#cbdcd5)}body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 32% 15%,#25344f,#141e34 58%,#0b1325);opacity:var(--night,0)}canvas{position:relative;z-index:1;display:block;width:100%;height:100%;touch-action:none;outline:none;cursor:grab}canvas:active{cursor:grabbing}
.period-switch{position:fixed;z-index:2;top:max(20px,env(safe-area-inset-top));right:max(20px,env(safe-area-inset-right));display:flex;gap:4px;padding:5px;border:1px solid #7b8b7133;border-radius:28px;background:#fffbedb8;box-shadow:0 3px 18px #31483a14;backdrop-filter:blur(12px)}
.period-switch[hidden]{display:none}.period-switch button{display:grid;place-items:center;width:38px;height:38px;padding:8px;border:0;border-radius:50%;background:transparent;color:#65776c;cursor:pointer;touch-action:manipulation}.period-switch svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}.period-switch button:hover{background:#d6dfc94d}.period-switch button[aria-pressed="true"]{color:#485b43;background:#d9dfc7}.period-switch button:focus-visible{outline:2px solid #b88848;outline-offset:3px}body[data-period="night"] .period-switch{background:#182338c9;border-color:#e6d6b423}body[data-period="night"] .period-switch button{color:#b9c4d7}body[data-period="night"] .period-switch button[aria-pressed="true"]{color:#f3cf8f;background:#5f4c333d}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:500px){.period-switch{top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right))}}
</style>
</head>
<body>
<div class="period-switch" role="group" aria-label="书房昼夜切换" hidden>
<button type="button" data-time="auto" aria-label="自动跟随本地时间" title="自动：6:00–18:00 为白天" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></svg></button>
<button type="button" data-time="day" aria-label="切换到白天" title="白天" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
<button type="button" data-time="night" aria-label="切换到夜晚" title="夜晚" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14A8.7 8.7 0 0 1 10 3.5 8.8 8.8 0 1 0 20.5 14Z"/></svg></button>
</div><span class="period-status sr-only" role="status" aria-live="polite"></span>
<script>/* SCENE */</script></body>
</html>
